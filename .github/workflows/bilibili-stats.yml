name: Update Bilibili stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Bilibili statistics
        env:
          BILIBILI_UID: "282601111"
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import base64
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          uid = os.environ["BILIBILI_UID"]
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Referer": f"https://space.bilibili.com/{uid}",
          }
          if os.environ.get("BILIBILI_SESSDATA"):
              headers["Cookie"] = "SESSDATA=" + os.environ["BILIBILI_SESSDATA"]

          def get_json(url):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          relation = get_json(f"https://api.bilibili.com/x/relation/stat?vmid={uid}")
          if relation.get("code") != 0:
              raise RuntimeError(f"Bilibili relation API error: {relation}")

          def parse_play(value):
              if isinstance(value, (int, float)):
                  return int(value)
              text = str(value or "0").replace(",", "").strip().rstrip("+")
              multiplier = 1
              if text.endswith("亿"):
                  multiplier, text = 100000000, text[:-1]
              elif text.endswith("万"):
                  multiplier, text = 10000, text[:-1]
              return int(float(text or 0) * multiplier)

          def format_count(value):
              value = int(value)
              if value >= 10000:
                  return f"{value / 1000000:.2f} million"
              return str(value)

          views = None

          # This endpoint returns the creator's aggregate video view count.
          # It works with BILIBILI_SESSDATA and avoids summing only the first
          # page of uploads.
          try:
              upstat = get_json(f"https://api.bilibili.com/x/space/upstat?mid={uid}")
              archive = upstat.get("data", {}).get("archive", {})
              if upstat.get("code") == 0 and archive.get("view") is not None:
                  views = parse_play(archive["view"])
          except Exception as error:
              print(f"Bilibili upstat API unavailable: {error}")

          try:
              legacy_url = f"https://api.bilibili.com/x/space/arc/search?mid={uid}&pn=1&ps=100&order=pubdate&jsonp=jsonp"
              legacy = get_json(legacy_url)
              if views is None and legacy.get("code") == 0:
                  videos = legacy.get("data", {}).get("list", {}).get("vlist", [])
                  views = sum(parse_play(video.get("play", 0)) for video in videos)
          except Exception as error:
              print(f"Legacy Bilibili video API unavailable: {error}")

          if views is None:
            try:
              nav = get_json("https://api.bilibili.com/x/web-interface/nav")
              img_key = nav["data"]["wbi_img"]["img_url"].rsplit("/", 1)[1].split(".", 1)[0]
              sub_key = nav["data"]["wbi_img"]["sub_url"].rsplit("/", 1)[1].split(".", 1)[0]
              mixin_table = [46, 33, 38, 15, 53, 42, 29, 44, 40, 2, 49, 20, 56, 8, 23, 24, 9, 52, 32, 13, 5, 50, 19, 26, 34, 3, 27, 43, 21, 10, 28, 55, 35, 4, 45, 6, 25, 16, 18, 22, 17, 39, 7, 31, 1, 37, 30, 14, 12, 36, 51, 11, 48, 0, 41, 47, 54]
              mixin_key = "".join((img_key + sub_key)[i] for i in mixin_table)[:32]
              params = {"mid": uid, "ps": 100, "pn": 1, "keyword": "", "order": "pubdate", "platform": "web", "web_location": 1550101, "order_avoided": "true", "wts": int(time.time())}
              query = urlencode(sorted(params.items()))
              params["w_rid"] = hashlib.md5((query + mixin_key).encode()).hexdigest()
              archive = get_json("https://api.bilibili.com/x/space/wbi/arc/search?" + urlencode(params))
              if views is None and archive.get("code") == 0:
                  videos = archive.get("data", {}).get("list", {}).get("vlist", [])
                  views = sum(parse_play(video.get("play", 0)) for video in videos)
            except Exception as error:
              print(f"WBI Bilibili video API unavailable: {error}")

          views = format_count(views) if views is not None else "Unavailable"

          # Embed the avatar directly in the SVG. GitHub may block external
          # image references from SVG files, while a data URI is self-contained.
          avatar_url = "https://i0.hdslb.com/bfs/face/9d38531eb2b47cf35c08eb75167571ea370e22e8.jpg"
          avatar_request = Request(avatar_url, headers=headers)
          with urlopen(avatar_request, timeout=30) as response:
              avatar_b64 = base64.b64encode(response.read()).decode("ascii")

          with open("bilibili-data.json", "w", encoding="utf-8") as output:
              json.dump({
                  "followers": relation["data"].get("follower", 0),
                  "views": views,
                  "avatar": avatar_b64,
              }, output)
          PY

          follower_count="$(jq -r '.followers' bilibili-data.json)"
          video_views="$(jq -r '.views' bilibili-data.json)"
          avatar_b64="$(jq -r '.avatar' bilibili-data.json)"

          cat > bilibili-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="680" height="170" viewBox="0 0 680 170" role="img" aria-label="Bilibili statistics">
            <defs>
              <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
                <stop stop-color="#171b2b" />
                <stop offset="1" stop-color="#242b4a" />
              </linearGradient>
              <clipPath id="avatarClip"><circle cx="82" cy="85" r="50" /></clipPath>
            </defs>
            <rect width="680" height="170" rx="14" fill="url(#bg)" />
            <image href="data:image/jpeg;base64,${avatar_b64}" x="32" y="35" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />
            <circle cx="82" cy="85" r="52" fill="none" stroke="#79d9ff" stroke-width="4" />
            <text x="160" y="42" fill="#79d9ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Bilibili Stats</text>
            <text x="160" y="72" fill="#b8c1d9" font-family="Arial,sans-serif" font-size="15">墨梅MnMei</text>
            <text x="160" y="122" fill="#ffffff" font-family="Arial,sans-serif" font-size="26" font-weight="700">${follower_count}</text>
            <text x="160" y="145" fill="#9da9c7" font-family="Arial,sans-serif" font-size="13">Followers</text>
            <text x="420" y="122" fill="#ffffff" font-family="Arial,sans-serif" font-size="26" font-weight="700">${video_views}</text>
            <text x="420" y="145" fill="#9da9c7" font-family="Arial,sans-serif" font-size="13">Video views</text>
            <circle cx="638" cy="42" r="10" fill="#79d9ff" opacity=".9" />
            <circle cx="653" cy="42" r="10" fill="#ff83b8" opacity=".9" />
          </svg>
          EOF

      - name: Commit updated card
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add bilibili-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Bilibili statistics"
            git push
          fi
